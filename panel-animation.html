<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Panel 3D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020b18; overflow:hidden; font-family:'Share Tech Mono',monospace; }
  canvas { display:block; }

  .title {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:4px;
    color:#2a5a7a; z-index:10; text-transform:uppercase; white-space:nowrap;
    transition: color 0.5s, text-shadow 0.5s;
  }

  .clock {
    position:fixed; top:42px; right:16px; z-index:11;
    background:rgba(0,12,26,.85); border:1px solid #1e4a6a; border-radius:6px;
    padding:6px 9px; backdrop-filter:blur(6px); width:124px; text-align:center;
  }
  .clock-time {
    font-family:'Orbitron',sans-serif; font-size:16px; letter-spacing:1px;
    color:#cfe6ff; line-height:1; text-shadow:0 0 10px rgba(120,180,255,.4);
  }
  .clock-phase {
    font-size:6px; letter-spacing:1.5px; color:#6a9ac0; margin-top:3px;
    text-transform:uppercase;
  }
  .clock-track {
    position:relative; height:5px; margin:6px 0 2px;
    background:#0a1a2a; border:1px solid #1e3a5a; border-radius:3px; overflow:hidden;
  }
  .clock-day {
    position:absolute; top:0; bottom:0; left:25%; width:50%;
    background:linear-gradient(90deg,#3a5a2a,#caa83a,#3a5a2a); opacity:.55;
  }
  .clock-marker {
    position:absolute; top:-2px; width:2px; height:9px; border-radius:2px;
    background:#ffd24a; box-shadow:0 0 6px 2px rgba(255,210,74,.7);
    transform:translateX(-50%); transition:left .1s linear;
  }
  .clock-ticks {
    display:flex; justify-content:space-between;
    font-family:'Share Tech Mono',monospace; font-size:6px; color:#4a6a8a;
  }
  .display {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    z-index:10; display:flex; align-items:center; gap:15px;
    background:rgba(0,10,25,.85); border:1px solid #1e4a6a;
    border-radius:7px; padding:8px 18px; backdrop-filter:blur(6px);
  }
  .stat { display:flex; flex-direction:column; align-items:center; gap:1px; }
  .stat-label { font-size:7px; color:#4a7a9a; letter-spacing:1.5px; text-transform:uppercase; }
  .stat-value { font-family:'Orbitron',sans-serif; font-size:14px; color:#00e5ff; transition:color 0.4s; }
  .divider { width:1px; height:28px; background:#1e3a5a; }

  .hint {
    position:fixed; top:42px; left:50%; transform:translateX(-50%);
    font-size:9px; letter-spacing:1.5px; color:#5a8aaa; z-index:10;
    text-transform:uppercase; white-space:nowrap;
    transition:opacity 0.6s; pointer-events:none;
  }
  .resume {
    position:fixed; top:16px; left:16px; z-index:12;
    font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px;
    color:#9ad; background:rgba(0,20,40,.8); border:1px solid #2a5a7a;
    border-radius:5px; padding:6px 11px; cursor:pointer; text-transform:uppercase;
    transition:background .2s, border-color .2s;
  }
  .resume:hover { background:rgba(0,40,70,.9); border-color:#00aadd; }

  .sensors {
    position:fixed; top:52px; left:16px; z-index:11;
    background:rgba(0,12,26,.85); border:1px solid #1e4a6a; border-radius:7px;
    padding:9px 11px; backdrop-filter:blur(6px); width:168px;
  }
  .sensors-head {
    font-family:'Orbitron',sans-serif; font-size:8px; letter-spacing:1.5px;
    color:#5a8aaa; margin-bottom:8px; text-transform:uppercase;
  }
  .ldr-row { display:flex; gap:9px; }
  .ldr { flex:1; }
  .ldr-label { font-size:7px; letter-spacing:1px; color:#7aa; margin-bottom:3px; }
  .ldr-bar {
    height:6px; background:#0a1a2a; border:1px solid #1e3a5a;
    border-radius:4px; overflow:hidden;
  }
  .ldr-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#0a4,#ffcc44); transition:width .12s linear;
  }
  .ldr-val { font-family:'Share Tech Mono',monospace; font-size:9px; color:#9cf; margin-top:2px; }
</style>
</head>
<body>

<div class="title">Solar Tracker — 24h Day Cycle</div>

<div class="clock" id="clock">
  <div class="clock-time" id="clockTime">06:00</div>
  <div class="clock-phase" id="clockPhase">SUNRISE</div>
  <div class="clock-track">
    <div class="clock-day" id="clockDay"></div>
    <div class="clock-marker" id="clockMarker"></div>
  </div>
  <div class="clock-ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
</div>

<div class="hint" id="hint">◐ Drag the sun — the LDR sensors will make the motor chase it</div>
<button class="resume" id="resumeBtn">▶ Auto</button>

<div class="sensors" id="sensors">
  <div class="sensors-head">ESP32 CONTROL LOOP</div>
  <div class="ldr-row">
    <div class="ldr">
      <div class="ldr-label">LDR&nbsp;L</div>
      <div class="ldr-bar"><div class="ldr-fill" id="barL"></div></div>
      <div class="ldr-val" id="valL">0.00</div>
    </div>
    <div class="ldr">
      <div class="ldr-label">LDR&nbsp;R</div>
      <div class="ldr-bar"><div class="ldr-fill" id="barR"></div></div>
      <div class="ldr-val" id="valR">0.00</div>
    </div>
  </div>
</div>

<div class="display">
  <div class="stat"><div class="stat-label">Output</div><div class="stat-value" id="watt-val">— W</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="stat-label">Voltage</div><div class="stat-value" id="volt-val">— V</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="stat-label">Tracking</div><div class="stat-value" id="eff-val">—%</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="stat-label">Panel Angle</div><div class="stat-value" id="ang-val">—°</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(11, 9, 22);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.background = new THREE.Color(0x0a1f35);
scene.fog = new THREE.Fog(0x0a1f35, 30, 80);

const ambientLight = new THREE.AmbientLight(0x112233, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5cc, 0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far  = 80;
sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = -20;
sunLight.shadow.camera.right = sunLight.shadow.camera.top  =  20;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x224466, 0x113311, 0.3);
scene.add(hemiLight);

const sunGeo  = new THREE.SphereGeometry(0.9, 32, 32);
const sunMat  = new THREE.MeshBasicMaterial({ color: 0xffd700 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
scene.add(sunMesh);

const glowCanvas = document.createElement('canvas');
glowCanvas.width = glowCanvas.height = 128;
const gc = glowCanvas.getContext('2d');
const grad = gc.createRadialGradient(64,64,0, 64,64,64);
grad.addColorStop(0,   'rgba(255,220,80,0.9)');
grad.addColorStop(0.3, 'rgba(255,160,0,0.5)');
grad.addColorStop(1,   'rgba(255,80,0,0)');
gc.fillStyle = grad;
gc.fillRect(0,0,128,128);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false });
const glowSprite = new THREE.Sprite(glowMat);
glowSprite.scale.set(8, 8, 1);
sunMesh.add(glowSprite);

const SUN_RADIUS = 22;
const SUN_PEAK   = 16;
const SUN_Z      = -15;
function sunArcPos(u) {
  const angle = u * Math.PI;
  const azimuth   = Math.cos(angle);
  const sunFactor = Math.sin(angle);
  return new THREE.Vector3(
    -azimuth * SUN_RADIUS,
    2 + sunFactor * SUN_PEAK,
    SUN_Z
  );
}

const arcPts = [];
for (let i = 0; i <= 80; i++) arcPts.push(sunArcPos(i / 80));
const arcGeo = new THREE.BufferGeometry().setFromPoints(arcPts);
const arcMat = new THREE.LineDashedMaterial({
  color: 0xffcc66, transparent: true, opacity: 0.45,
  dashSize: 0.8, gapSize: 0.6
});
const arcLine = new THREE.Line(arcGeo, arcMat);
arcLine.computeLineDistances();
scene.add(arcLine);

function marker(pos, color) {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(0.5, 0.7, 24),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5, side:THREE.DoubleSide })
  );
  m.position.copy(pos);
  m.lookAt(camera.position);
  scene.add(m);
  return m;
}
marker(sunArcPos(0), 0xff8844);
marker(sunArcPos(1), 0xff8844);

const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x0d1f0d });
const ground    = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

function box(w, h, d, color, rough=0.6, metal=0.3) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
  const m   = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, color, segs=16, rough=0.5, metal=0.5) {
  const geo = new THREE.CylinderGeometry(rt, rb, h, segs);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
  const m   = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ── DIMENSIONS ─────────────────────────────────────────────────────────────
const PANEL_W = 4.0;
const PANEL_H = 2.2;
const PANEL_D = 0.08;
const POLE_H  = 4.0;
const POLE_RAD = 0.12;

// ── STATION NIGHT LIGHTING ─────────────────────────────────────────────────
const stationLights = [];
function lampPost(x) {
  const g = new THREE.Group();
  g.position.set(x, 0, 1.6);
  const post = cyl(0.06, 0.07, 3.2, 0x2a3a4a, 10, 0.5, 0.6);
  post.position.y = 1.6;
  g.add(post);
  const arm = box(0.06, 0.06, 0.9, 0x2a3a4a, 0.5, 0.6);
  arm.position.set(0, 3.1, -0.45);
  g.add(arm);
  const lampMat = new THREE.MeshStandardMaterial({
    color: 0x332b18, emissive: 0x000000, emissiveIntensity: 1, roughness: 0.4
  });
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), lampMat);
  lamp.position.set(0, 3.05, -0.9);
  g.add(lamp);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffd27a, transparent: true, opacity: 0, depthWrite: false
  }));
  glow.scale.set(2.2, 2.2, 1);
  glow.position.copy(lamp.position);
  g.add(glow);
  const light = new THREE.PointLight(0xffce85, 0, 14, 2);
  light.position.copy(lamp.position);
  light.castShadow = true;
  light.shadow.mapSize.set(1024, 1024);
  g.add(light);
  scene.add(g);
  stationLights.push({ lampMat, glow, light });
}
lampPost(-3.2);
lampPost( 3.2);

// ── PANEL PIVOT GROUP ──────────────────────────────────────────────────────
const panelTracker = new THREE.Group();
panelTracker.position.set(0, POLE_H, 0);
scene.add(panelTracker);

const panelPivot = new THREE.Group();
panelPivot.rotation.x = -Math.PI / 2;
panelTracker.add(panelPivot);

// mounting bracket stub
const stub = cyl(0.08, 0.08, 0.35, 0x2e4a6a);
stub.rotation.x = Math.PI / 2;
stub.position.set(0, 0, 0);
panelPivot.add(stub);

// ── PANEL FRAME ────────────────────────────────────────────────────────────
const frameBack = box(PANEL_W + 0.14, PANEL_H + 0.14, PANEL_D, 0x2a3a4a, 0.4, 0.7);
frameBack.position.set(0, 0, -0.18);
panelPivot.add(frameBack);

const cellCanvas = document.createElement('canvas');
cellCanvas.width  = 800;
cellCanvas.height = 440;
const ctx = cellCanvas.getContext('2d');

function drawCells(brightness) {
  ctx.fillStyle = `rgb(10,${18+brightness*8},${35+brightness*15})`;
  ctx.fillRect(0,0,800,440);
  const cols = 8, rows = 4;
  const cw = (800 - 20) / cols;
  const ch = (440 - 20) / rows;
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      const x = 10 + c*cw + 2;
      const y = 10 + r*ch + 2;
      const w = cw - 4, h = ch - 4;
      const b = brightness;
      ctx.fillStyle = `rgb(${12+b*6},${28+b*28},${55+b*45})`;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = `rgba(${80+b*60},${140+b*80},${200+b*55},${0.3+b*0.4})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(x, y+h/2); ctx.lineTo(x+w, y+h/2); ctx.stroke();
      for (let i=1; i<6; i++) {
        ctx.beginPath();
        ctx.moveTo(x + w*i/6, y);
        ctx.lineTo(x + w*i/6, y+h);
        ctx.stroke();
      }
      if (b > 0.1) {
        const g = ctx.createLinearGradient(x, y, x+w, y+h);
        g.addColorStop(0,   `rgba(120,200,255,0)`);
        g.addColorStop(0.4, `rgba(120,200,255,${b*0.18})`);
        g.addColorStop(1,   `rgba(120,200,255,0)`);
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);
      }
    }
  }
  ctx.strokeStyle = `rgb(30,${60+brightness*30},${95+brightness*40})`;
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, 794, 434);
}

drawCells(0);
const cellTex  = new THREE.CanvasTexture(cellCanvas);
const panelGeo = new THREE.BoxGeometry(PANEL_W, PANEL_H, PANEL_D);
const panelMats = [
  new THREE.MeshStandardMaterial({ color:0x1a2a3a, roughness:0.5, metalness:0.6 }),
  new THREE.MeshStandardMaterial({ color:0x1a2a3a, roughness:0.5, metalness:0.6 }),
  new THREE.MeshStandardMaterial({ color:0x1a2a3a, roughness:0.5, metalness:0.6 }),
  new THREE.MeshStandardMaterial({ color:0x1a2a3a, roughness:0.5, metalness:0.6 }),
  new THREE.MeshStandardMaterial({ map: cellTex,   roughness:0.2, metalness:0.1 }),
  new THREE.MeshStandardMaterial({ color:0x0a1020, roughness:0.8, metalness:0.2 }),
];
const panelMesh = new THREE.Mesh(panelGeo, panelMats);
panelMesh.position.set(0, 0, 0);
panelMesh.castShadow = true;
panelMesh.receiveShadow = true;
panelPivot.add(panelMesh);

const trimTop = box(PANEL_W+0.04, 0.1, PANEL_D+0.02, 0x3a5a7a, 0.3, 0.8);
trimTop.position.set(0, PANEL_H/2+0.05, 0);
panelPivot.add(trimTop);
const trimBot = box(PANEL_W+0.04, 0.1, PANEL_D+0.02, 0x3a5a7a, 0.3, 0.8);
trimBot.position.set(0, -PANEL_H/2-0.05, 0);
panelPivot.add(trimBot);
const trimL = box(0.1, PANEL_H+0.24, PANEL_D+0.02, 0x3a5a7a, 0.3, 0.8);
trimL.position.set(-PANEL_W/2-0.05, 0, 0);
panelPivot.add(trimL);
const trimR = box(0.1, PANEL_H+0.24, PANEL_D+0.02, 0x3a5a7a, 0.3, 0.8);
trimR.position.set(PANEL_W/2+0.05, 0, 0);
panelPivot.add(trimR);

// pivot pin
const pin = cyl(0.1, 0.1, PANEL_W+0.6, 0x4a8aaa, 12, 0.2, 0.9);
pin.rotation.z = Math.PI/2;
pin.position.set(0, 0, 0);
panelPivot.add(pin);

// ── LEGS — children of panelPivot, rotate with panel ──────────────────────
// Positioned at the panel's left and right edges (±PANEL_W/2).
// In panelPivot local space, -Y is downward toward the ground.
// Each leg length = POLE_H so the foot reaches ground when panel is at rest.
[-PANEL_W/2, PANEL_W/2].forEach(xPos => {
  const legGroup = new THREE.Group();
  legGroup.position.set(0, 0, xPos);

  // pole — centred between pivot and ground
  const pole = cyl(POLE_RAD, POLE_RAD * 1.1, POLE_H, 0x2e4a6a);
  pole.position.set(0, POLE_H / 2, 0);
  legGroup.add(pole);

  // foot base plate at ground level
  const foot = box(0.7, 0.12, 0.7, 0x1a3a1a, 0.8, 0.1);
  foot.position.set(0, 0.06, 0);
  legGroup.add(foot);

  scene.add(legGroup);
});

// ── LDR SENSORS + SHADING FIN ─────────────────────────────────────────────
const FRAME_X  = PANEL_W/2 + 0.05;
const FRAME_FZ = (PANEL_D + 0.02)/2;

function ldr(color) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.12, 0.08, 20),
    new THREE.MeshStandardMaterial({ color, emissive:0x000000, roughness:0.4, metalness:0.3 })
  );
  m.rotation.x = Math.PI/2;
  m.castShadow = true;
  return m;
}
const ldrLeft  = ldr(0x882222);
ldrLeft.position.set(-FRAME_X, 0, FRAME_FZ + 0.05);
panelPivot.add(ldrLeft);

const ldrRight = ldr(0x882222);
ldrRight.position.set(FRAME_X, 0, FRAME_FZ + 0.05);
panelPivot.add(ldrRight);

const fin = box(0.06, 1.2, 0.5, 0x111820, 0.7, 0.2);
fin.rotation.x = Math.PI/2;
fin.position.set(0, 0, PANEL_D/2 + 0.28);
panelPivot.add(fin);

// ── REFERENCE POSITIONS ────────────────────────────────────────────────────
const PIVOT_POS = new THREE.Vector3(0, POLE_H, 0);
function aimAngleForU(u) {
  const toSun = sunArcPos(u).clone().sub(PIVOT_POS).normalize();
  return Math.atan2(-toSun.x, toSun.y);
}
const START_ANGLE = aimAngleForU(0.04);
const END_ANGLE   = aimAngleForU(0.96);

function refPanel(angleZ, color) {
  const g = new THREE.Group();
  g.position.copy(PIVOT_POS);
  g.rotation.z = angleZ;
  const inner = new THREE.Group();
  inner.rotation.x = -Math.PI / 2;
  const hw = (PANEL_W + 0.14) / 2, hh = (PANEL_H + 0.14) / 2;
  const pts = [
    new THREE.Vector3(-hw,-hh,0), new THREE.Vector3( hw,-hh,0),
    new THREE.Vector3( hw, hh,0), new THREE.Vector3(-hw, hh,0),
    new THREE.Vector3(-hw,-hh,0)
  ];
  const lg = new THREE.BufferGeometry().setFromPoints(pts);
  const lm = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.55 });
  inner.add(new THREE.Line(lg, lm));
  g.add(inner);
  scene.add(g);
  return g;
}
refPanel(START_ANGLE, 0x44ddff);
refPanel(END_ANGLE,   0xffaa44);

function textLabel(text, color, pos) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = color;
  x.font = 'bold 34px "Share Tech Mono", monospace';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set(3, 0.75, 1);
  spr.position.copy(pos);
  scene.add(spr);
  return spr;
}
function refLabelPos(angleZ, dist) {
  return new THREE.Vector3(-Math.sin(angleZ)*dist, Math.cos(angleZ)*dist, 0).add(PIVOT_POS);
}

(function drawSweepArc() {
  const r = 1.4;
  const segs = 48;
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const a = START_ANGLE + (END_ANGLE - START_ANGLE) * (i / segs);
    pts.push(new THREE.Vector3(-Math.sin(a)*r, Math.cos(a)*r, 0).add(PIVOT_POS));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineDashedMaterial({ color:0x66aacc, transparent:true, opacity:0.4, dashSize:0.25, gapSize:0.2 });
  const line = new THREE.Line(g, m);
  line.computeLineDistances();
  scene.add(line);
})();

// ── STARS ──────────────────────────────────────────────────────────────────
const starCount = 800;
const starPositions = new Float32Array(starCount * 3);
for (let i=0; i<starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2*Math.random()-1);
  const r     = 60 + Math.random()*20;
  starPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i*3+1] = Math.abs(r * Math.cos(phi));
  starPositions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:0.18, sizeAttenuation:true });
scene.add(new THREE.Points(starGeo, starMat));

// ── ANIMATION LOOP ─────────────────────────────────────────────────────────
const CYCLE = 12000;
const NIGHT_DWELL = 6000;
const watts = document.getElementById('watt-val');
const volts = document.getElementById('volt-val');
const eff   = document.getElementById('eff-val');
const title = document.querySelector('.title');
const hint      = document.getElementById('hint');
const resumeBtn = document.getElementById('resumeBtn');
const angVal    = document.getElementById('ang-val');
const barL = document.getElementById('barL'), barR = document.getElementById('barR');
const valL = document.getElementById('valL'), valR = document.getElementById('valR');
const clockTime   = document.getElementById('clockTime');
const clockPhase  = document.getElementById('clockPhase');
const clockMarker = document.getElementById('clockMarker');
let lastBrightness = -1;
let currentAngle = 0;
const PARK = 90 * Math.PI / 180;
let panelZ     = PARK;
let sensorL    = 0;
let sensorR    = 0;
let sensorDiff = 0;
let motorDir   = 0;
let sunU      = 0.0;
let isDragging = false;
let autoPlay   = true;
let autoStartTime = Date.now();

function animate() {
  requestAnimationFrame(animate);

  let clockHours;
  if (autoPlay && !isDragging) {
    const period  = CYCLE + NIGHT_DWELL;
    const elapsed = (Date.now() - autoStartTime) % period;
    if (elapsed < CYCLE) {
      sunU = elapsed / CYCLE;
      clockHours = 6 + sunU * 12;
    } else {
      sunU = 1.0;
      const nightFrac = (elapsed - CYCLE) / NIGHT_DWELL;
      clockHours = (18 + nightFrac * 12) % 24;
    }
  } else {
    clockHours = 6 + sunU * 12;
  }

  const angle      = sunU * Math.PI;
  const sunFactor  = Math.max(0, Math.sin(angle));
  const azimuth    = Math.cos(angle);

  const sunPos = sunArcPos(sunU);
  sunMesh.position.copy(sunPos);
  sunLight.position.copy(sunMesh.position);
  sunLight.intensity = sunFactor * 2.2;
  const sunColorHot  = new THREE.Color(0xfff5cc);
  const sunColorCool = new THREE.Color(0xff8833);
  sunLight.color.lerpColors(sunColorCool, sunColorHot, sunFactor);
  ambientLight.intensity = 0.15 + sunFactor * 0.35;
  hemiLight.intensity    = 0.1  + sunFactor * 0.4;
  const nightCol = new THREE.Color(0x0a1f35);
  const dayCol   = new THREE.Color(0x1a4a7a);
  scene.background.lerpColors(nightCol, dayCol, sunFactor * 0.8);
  scene.fog.color.copy(scene.background);

  const nightLevel = THREE.MathUtils.clamp(1 - sunFactor / 0.12, 0, 1);
  stationLights.forEach(({ lampMat, glow, light }) => {
    lampMat.emissive.setHex(0xffce85);
    lampMat.emissiveIntensity = nightLevel;
    glow.material.opacity = 0.85 * nightLevel;
    light.intensity = 2.4 * nightLevel;
  });

  const toSun = new THREE.Vector3().copy(sunMesh.position).sub(panelTracker.position).normalize();
  let alignment = 0;
  const idealAngle = Math.atan2(-toSun.x, toSun.y);

  if (sunFactor > 0.02) {
    const err = idealAngle - panelZ;
    const incidence = Math.cos(err);
    const baseLight = Math.max(0, incidence) * sunFactor;
    const shadow = Math.min(1, Math.abs(err) * 2.2);
    const noise  = () => (Math.random() - 0.5) * 0.015;
    let ldrL = baseLight * (1 - (err > 0 ? shadow : 0)) + noise();
    let ldrR = baseLight * (1 - (err < 0 ? shadow : 0)) + noise();
    ldrL = Math.max(0, ldrL);
    ldrR = Math.max(0, ldrR);
    const diff = ldrR - ldrL;
    const DEADBAND = 0.01;
    const STEP     = 0.9 * Math.PI / 180;
    if (sunFactor > 0.04) {
      if (diff >  DEADBAND)      { panelZ += STEP; motorDir = 1;  }
      else if (diff < -DEADBAND) { panelZ -= STEP; motorDir = -1; }
      else                       { motorDir = 0; }
    } else { motorDir = 0; }
    sensorL = ldrL; sensorR = ldrR; sensorDiff = diff;
    ldrLeft.material.emissive.setRGB(ldrL*0.9, ldrL*0.5, 0);
    ldrRight.material.emissive.setRGB(ldrR*0.9, ldrR*0.5, 0);
    alignment = Math.max(0, Math.cos(idealAngle - panelZ));
  } else {
    sensorL = sensorR = 0; sensorDiff = 0;
    ldrLeft.material.emissive.setRGB(0,0,0);
    ldrRight.material.emissive.setRGB(0,0,0);
    const STEP = 0.9 * Math.PI / 180;
    if (Math.abs(panelZ - PARK) > STEP) {
      panelZ += (panelZ > PARK ? -STEP : STEP);
      motorDir = (panelZ > PARK ? -1 : 1);
    } else {
      panelZ = PARK;
      motorDir = 0;
    }
  }

  panelTracker.rotation.z = panelZ;
  currentAngle = panelZ;

  const brightness = Math.round(sunFactor * 10) / 10;
  if (Math.abs(brightness - lastBrightness) > 0.05) {
    drawCells(brightness);
    cellTex.needsUpdate = true;
    lastBrightness = brightness;
  }

  const capture = sunFactor * alignment;
  const w = capture > 0.005 ? Math.round(capture * 1200) : 0;
  const v = capture > 0.005 ? Math.round(200 + capture * 100) : 0;
  const e = sunFactor > 0.01 ? Math.round(100 * alignment) : 0;
  watts.textContent = w ? `${w} W` : '— W';
  volts.textContent = v ? `${v} V` : '— V';
  eff.textContent   = e ? `${e}%`  : '—%';
  const angDeg = Math.round(90 - currentAngle * 180 / Math.PI);
  angVal.textContent = `${angDeg}°`;

  barL.style.width = `${Math.min(100, sensorL * 100)}%`;
  barR.style.width = `${Math.min(100, sensorR * 100)}%`;
  valL.textContent = sensorL.toFixed(2);
  valR.textContent = sensorR.toFixed(2);
  const col = capture > 0.5 ? '#00ff88' : capture > 0.01 ? '#00e5ff' : '#4a7a9a';
  [watts,volts,eff].forEach(el => el.style.color = col);

  const hh = Math.floor(clockHours) % 24;
  const mm = Math.floor((clockHours - Math.floor(clockHours)) * 60);
  clockTime.textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  clockMarker.style.left = `${(clockHours / 24) * 100}%`;
  let phase;
  if      (clockHours < 5.5 || clockHours >= 18.5) phase = 'NIGHT';
  else if (clockHours < 7)                          phase = 'SUNRISE';
  else if (clockHours < 11)                         phase = 'MORNING';
  else if (clockHours < 13)                         phase = 'MIDDAY';
  else if (clockHours < 17)                         phase = 'AFTERNOON';
  else                                              phase = 'SUNSET';
  clockPhase.textContent = phase;
  clockTime.style.color = sunFactor > 0.05 ? '#cfe6ff' : '#5a7a9a';
  if (sunFactor > 0.4) {
    title.style.color      = '#00aadd';
    title.style.textShadow = '0 0 20px rgba(0,170,221,0.4)';
  } else {
    title.style.color      = '#2a5a7a';
    title.style.textShadow = 'none';
  }

  renderer.render(scene, camera);
}
animate();

// ── DRAG INTERACTION ───────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();

function setPointer(e) {
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  pointer.x = (x / innerWidth)  * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
}

function pointerToU() {
  raycaster.setFromCamera(pointer, camera);
  const ray = raycaster.ray;
  let bestU = sunU, bestDist = Infinity;
  for (let i = 0; i <= 120; i++) {
    const u = i / 120;
    const p = sunArcPos(u);
    const d = ray.distanceToPoint(p);
    if (d < bestDist) { bestDist = d; bestU = u; }
  }
  return bestU;
}

function onDown(e) {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.ray.distanceToPoint(sunMesh.position) < 3.0;
  if (hit) {
    isDragging = true;
    autoPlay   = false;
    document.body.style.cursor = 'grabbing';
    hint.style.opacity = '0';
    e.preventDefault();
  }
}
function onMove(e) {
  if (isDragging) {
    setPointer(e);
    sunU = pointerToU();
    e.preventDefault();
  } else {
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    const near = raycaster.ray.distanceToPoint(sunMesh.position) < 3.0;
    document.body.style.cursor = near ? 'grab' : 'default';
  }
}
function onUp() {
  isDragging = false;
  document.body.style.cursor = 'default';
}

renderer.domElement.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup',   onUp);
renderer.domElement.addEventListener('touchstart', onDown, { passive:false });
window.addEventListener('touchmove', onMove, { passive:false });
window.addEventListener('touchend',  onUp);

resumeBtn.addEventListener('click', () => {
  autoPlay = true;
  autoStartTime = Date.now() - sunU * CYCLE;
});
</script>
</body>
</html>
